name: Validate Architecture

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Export Model to JSON using Structurizr CLI Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/usr/local/structurizr structurizr/cli:latest export -workspace architecture.dsl -format json -output .
        # This mounts your repo and exports model.json in the workspace root
      
      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v0.62.1/opa_linux_amd64_static
          chmod +x opa
      
      - name: Fetch Archetype Policy
        run: curl -o conformance.rego https://raw.githubusercontent.com/your-org/enterprise-archetypes/main/web-app/conformance.rego
      
      - name: Validate Conformance
        run: ./opa eval --fail-defined --format pretty --input model.json --data conformance.rego "data.archetype.webapp.deny"