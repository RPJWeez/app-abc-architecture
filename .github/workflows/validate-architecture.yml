name: Validate Architecture

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Structurizr CLI
        run: |
          curl -L -o structurizr-cli.zip https://github.com/structurizr/cli/releases/download/v2025.11.09/structurizr-cli.zip
          unzip structurizr-cli.zip -d structurizr-cli
          chmod +x structurizr-cli/structurizr.sh
      
      - name: Export Model to JSON
        run: |
          ./structurizr-cli/structurizr.sh export -workspace architecture.dsl -format json
          cat architecture.json
      
      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
      
      - name: Fetch Archetype Policy
        run: curl -o rules.rego https://raw.githubusercontent.com/RPJWeez/architecture-patterns/refs/heads/master/architecture-patterns/archetypes/internal-api/internal-api-openshift/rules.rego
      
      - name: Validate Conformance
        run: |
          result=$(./opa eval --format json --input architecture.json --data rules.rego "data.archetype.webapp.deny")
          echo "$result"
          if [ "$result" != "[]" ] && [ "$result" != "null" ]; then
            echo "Architecture validation failed!"
            exit 1
          fi
          echo "Architecture conforms to archetype"